name: Secure CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secure-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compiler and conformance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify native compiler
        run: gcc --version

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Secure conformance and sanitizer suite
        run: python3 tests/run_tests.py
