name: Secure CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (GCC, ASan, UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show toolchain
        run: |
          python3 --version
          gcc --version
      - name: Verify Python syntax
        run: python3 -m compileall -q securec tests
      - name: Verify compiler entry point
        run: test -x bin/securec
      - name: Test sanitizer diagnostics and front-end robustness
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Run conformance suite
        run: python3 tests/run_tests.py

  frontend-fuzz:
    name: Frontend fuzzing (Atheris)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create isolated fuzzing environment
        run: python3 -m venv .venv-fuzz
      - name: Install hash-verified Atheris dependency
        run: .venv-fuzz/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements-fuzz.txt
      - name: Fuzz lexer, parser, type checker and C lowering
        run: .venv-fuzz/bin/python tests/fuzz_frontend.py tests/fuzz_corpus -atheris_runs=30000

  generated-c-analysis:
    name: Generated C static analysis (GCC -fanalyzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show analyzer version
        run: gcc --version
      - name: Analyze generated C from passing conformance cases
        run: python3 tests/run_analyzer.py
