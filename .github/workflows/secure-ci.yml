name: Secure CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (GCC, ASan, UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python syntax
        run: python -m compileall -q securec tests
      - name: Verify compiler entry point
        run: test -x bin/securec
      - name: Run conformance suite
        run: python3 tests/run_tests.py
