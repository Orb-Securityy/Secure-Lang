name: Clean merged branches

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: clean-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged PR branches safely
    runs-on: ubuntu-latest
    steps:
      - name: Remove branches whose PRs are merged
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const defaultBranch = context.payload.repository?.default_branch ?? "main";

            const [closed, open] = await Promise.all([
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "closed", per_page: 100
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100
              })
            ]);

            const openHeads = new Set(
              open
                .filter(pr => pr.head.repo)
                .map(pr => `${pr.head.repo.full_name}:${pr.head.ref}`)
            );

            const seen = new Set();
            const deleted = [];
            const skipped = [];
            const failures = [];

            for (const pr of closed) {
              const head = pr.head;
              if (!pr.merged_at || !head.repo || head.repo.full_name !== repository) continue;
              if (!head.ref || head.ref === defaultBranch) continue;

              const key = `${repository}:${head.ref}`;
              if (seen.has(key)) continue;
              seen.add(key);

              if (openHeads.has(key)) {
                skipped.push(`${head.ref}: used by an open PR`);
                continue;
              }

              try {
                const current = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${head.ref}`
                });

                // Preserve branches that received commits after the merged PR.
                if (current.data.object.sha !== head.sha) {
                  skipped.push(`${head.ref}: advanced after merge`);
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${head.ref}`
                });
                deleted.push(head.ref);
              } catch (error) {
                if (error.status === 404) {
                  skipped.push(`${head.ref}: already absent`);
                } else {
                  failures.push(`${head.ref}: ${error.message}`);
                }
              }
            }

            // These closed/orphaned branches were audited as superseded by later merged work.
            // Delete only the exact reviewed heads; any branch that moved is preserved.
            const retiredBranches = [
              { ref: "fix/non-ascii-lexer-crash", sha: "41653b6e77c82d91b0e6f5e6a6d5ae65a90d9687" },
              { ref: "fix/source-file-read-diagnostics", sha: "357f7929bd4fbd810a8516c8ac87adf979ee8444" },
              { ref: "fix/source-file-read-diagnostics-v012", sha: "501a06f470f7f458c3bc412e158b2814c27864e2" },
              { ref: "test/stdin-conformance-and-integer-boundaries", sha: "a57d3420c6a1a2e05f6e968e92994184a1645947" },
              { ref: "test/stdin-conformance-main-v013", sha: "571afee5d0b324496ff926df3bef28f8de6232ad" },
              { ref: "audit/recursive-wrapper-later-embedded", sha: "e308241c17d78fc1e6e98aced2818fdd488a402c" },
              { ref: "fix/track-all-owned-expression-temporaries", sha: "c15506e1cbb72deb92504abb652ea7bd4edbb66f" }
            ];

            for (const branch of retiredBranches) {
              const key = `${repository}:${branch.ref}`;
              if (branch.ref === defaultBranch || openHeads.has(key)) {
                skipped.push(`${branch.ref}: protected or used by an open PR`);
                continue;
              }

              try {
                const current = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${branch.ref}`
                });
                if (current.data.object.sha !== branch.sha) {
                  skipped.push(`${branch.ref}: no longer matches reviewed stale head`);
                  continue;
                }
                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${branch.ref}`
                });
                deleted.push(branch.ref);
              } catch (error) {
                if (error.status === 404) {
                  skipped.push(`${branch.ref}: already absent`);
                } else {
                  failures.push(`${branch.ref}: ${error.message}`);
                }
              }
            }

            core.info(`Deleted ${deleted.length} branch(es) (merged or explicitly retired).`);
            for (const branch of deleted) core.info(`Deleted: ${branch}`);
            for (const item of skipped) core.info(`Skipped: ${item}`);
            for (const item of failures) core.error(`Failed: ${item}`);

            await core.summary
              .addHeading("Merged branch cleanup")
              .addTable([
                [{data: "Result", header: true}, {data: "Count", header: true}],
                ["Deleted", String(deleted.length)],
                ["Skipped", String(skipped.length)],
                ["Failed", String(failures.length)]
              ])
              .addList([...deleted.map(x => `Deleted: ${x}`), ...skipped.map(x => `Skipped: ${x}`), ...failures.map(x => `Failed: ${x}`)])
              .write();

            if (failures.length) {
              core.setFailed(`${failures.length} branch deletion(s) failed; inspect the workflow summary.`);
            }
